  <g id="text_37">
   <text style="fill: #47545b; font: 9px 'DejaVu Sans'" transform="translate(68.04 345.316781)">Hatched bars are post-hoc diagnostics from the same frozen-Qwen checkpoint, not replacement benchmark outputs.</text>
   <text style="fill: #47545b; font: 9px 'DejaVu Sans'" transform="translate(68.04 357.446391)">All target centers are used only after inference for evaluation. Prototype failures include large background outliers.</text>
   <text style="fill: #47545b; font: 9px 'DejaVu Sans'" transform="translate(68.04 369.576)">These endpoint checks do not measure full-path collision validity, distinct routes, or robot execution.</text>
  </g>
